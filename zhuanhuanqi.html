<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCZ 谱面转换器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 30px 0 20px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #f093fb, #f5576c, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-top: 8px;
        }

        .drop-zone {
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.02);
            position: relative;
        }

        .drop-zone:hover {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
        }

        .drop-zone.dragover {
            border-color: #4facfe;
            background: rgba(79, 172, 254, 0.1);
            transform: scale(1.02);
        }

        .drop-zone .icon {
            font-size: 64px;
            display: block;
            margin-bottom: 16px;
        }

        .drop-zone h3 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .drop-zone p {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
        }

        .drop-zone .formats {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .drop-zone .formats span {
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        #fileInput {
            display: none;
        }

        .file-list {
            margin-top: 24px;
            display: none;
        }

        .file-list.show {
            display: block;
        }

        .file-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 16px 20px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .file-item:hover {
            background: rgba(255, 255, 255, 0.07);
        }

        .file-item .file-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .file-item .info {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            min-width: 150px;
        }

        .file-item .info .file-icon {
            font-size: 28px;
            width: 40px;
            text-align: center;
        }

        .file-item .info .file-name {
            font-size: 14px;
            font-weight: 500;
            word-break: break-all;
        }

        .file-item .info .file-size {
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            margin-left: 8px;
        }

        .file-item .status {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .badge.waiting {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.4);
        }

        .badge.processing {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
            animation: pulse 1s infinite;
        }

        .badge.success {
            background: rgba(52, 211, 153, 0.2);
            color: #34d399;
        }

        .badge.error {
            background: rgba(251, 113, 133, 0.2);
            color: #fb7185;
        }

        .badge.extracting {
            background: rgba(96, 165, 250, 0.2);
            color: #60a5fa;
            animation: pulse 1s infinite;
        }

        .badge.partial {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        /* 子文件列表 */
        .mc-files {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: none;
        }

        .mc-files.show {
            display: block;
        }

        .mc-file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            margin-bottom: 6px;
            flex-wrap: wrap;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .mc-file-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .mc-file-item .mc-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 120px;
        }

        .mc-file-item .mc-info .mc-icon {
            font-size: 18px;
        }

        .mc-file-item .mc-info .mc-name {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            word-break: break-all;
        }

        .mc-file-item .mc-info .mc-status {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
        }

        .mc-file-item .mc-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-sm {
            padding: 4px 12px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .btn-sm:hover:not(:disabled) {
            transform: translateY(-1px);
        }

        .btn-sm:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .btn-download {
            background: linear-gradient(135deg, #34d399, #10b981);
            color: #fff;
        }

        .btn-download:hover:not(:disabled) {
            box-shadow: 0 4px 15px -3px rgba(16, 185, 129, 0.4);
        }

        .btn-download-all {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #fff;
        }

        .btn-download-all:hover:not(:disabled) {
            box-shadow: 0 4px 15px -3px rgba(79, 172, 254, 0.4);
        }

        .btn-success-sm {
            background: rgba(52, 211, 153, 0.15);
            color: #34d399;
        }

        .btn-success-sm:hover:not(:disabled) {
            background: rgba(52, 211, 153, 0.25);
        }

        .btn-error-sm {
            background: rgba(251, 113, 133, 0.15);
            color: #fb7185;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            justify-content: center;
            min-width: 120px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #fff;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -5px rgba(79, 172, 254, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .btn-danger {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.6);
        }

        .btn-danger:hover {
            background: rgba(251, 113, 133, 0.2);
            color: #fb7185;
        }

        .log-area {
            margin-top: 24px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 14px;
            padding: 16px 20px;
            max-height: 250px;
            overflow-y: auto;
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-family: 'JetBrains Mono', monospace;
        }

        .log-area.show {
            display: block;
        }

        .log-entry {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-entry.success {
            color: #34d399;
        }

        .log-entry.error {
            color: #fb7185;
        }

        .log-entry.info {
            color: #60a5fa;
        }

        .log-entry.warning {
            color: #fbbf24;
        }

        .log-area::-webkit-scrollbar {
            width: 4px;
        }

        .log-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .log-area::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 12px;
            margin-top: 16px;
            display: none;
        }

        .stats.show {
            display: grid;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            padding: 12px 16px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .stat-item .stat-value {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-item .stat-label {
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            margin-top: 16px;
            overflow: hidden;
            display: none;
        }

        .progress-bar.show {
            display: block;
        }

        .progress-bar .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            border-radius: 4px;
            transition: width 0.3s ease;
            width: 0%;
        }

        .empty-state {
            text-align: center;
            padding: 20px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
        }

        .toggle-files-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            font-size: 13px;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .toggle-files-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.6);
        }

        @media (max-width: 640px) {
            .header h1 {
                font-size: 24px;
            }

            .drop-zone {
                padding: 30px 16px;
            }

            .file-item {
                padding: 14px 16px;
            }

            .file-item .info {
                min-width: 100px;
            }

            .btn {
                padding: 12px 16px;
                font-size: 13px;
                min-width: 80px;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .mc-file-item {
                padding: 6px 10px;
            }

            .btn-sm {
                font-size: 11px;
                padding: 3px 10px;
            }
        }
    </style>
<base target="_blank">

<body>
    <div class="container">
        <div class="header">
            <h1>📦 MCZ 谱面转换器</h1>
            <p>上传 .mcz 压缩包，自动提取 .mc 文件并转换为 JSON 谱面</p>
        </div>

        <div class="drop-zone" id="dropZone">
            <span class="icon">📦</span>
            <h3>拖拽 .mcz 文件到这里</h3>
            <p>或点击选择文件</p>
            <div class="formats">
                <span>.mcz</span>
                <span>📁 压缩包</span>
                <span>🎵 包含 .mc 谱面</span>
            </div>
        </div>

        <input type="file" id="fileInput" accept=".mcz,.zip" multiple>

        <div class="file-list" id="fileList"></div>

        <div class="btn-group">
            <button class="btn btn-primary" id="convertBtn" disabled>
                🔄 开始转换
            </button>
            <button class="btn btn-danger" id="clearBtn">
                🗑️ 清空
            </button>
        </div>

        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="stats" id="stats"></div>

        <div class="log-area" id="logArea"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js">
    </script>
    <script>
        class MCZConverter {
            constructor() {
                this.files = [];
                this.results = [];
                this.isProcessing = false;
                this.expandedArchives = new Set();

                this.dropZone = document.getElementById('dropZone');
                this.fileInput = document.getElementById('fileInput');
                this.fileList = document.getElementById('fileList');
                this.convertBtn = document.getElementById('convertBtn');
                this.clearBtn = document.getElementById('clearBtn');
                this.logArea = document.getElementById('logArea');
                this.stats = document.getElementById('stats');
                this.progressBar = document.getElementById('progressBar');
                this.progressFill = document.getElementById('progressFill');

                this.initEvents();
            }

            initEvents() {
                this.dropZone.addEventListener('click', () => {
                    this.fileInput.click();
                });

                this.fileInput.addEventListener('change', (e) => {
                    this.handleFiles(e.target.files);
                    this.fileInput.value = '';
                });

                this.dropZone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    this.dropZone.classList.add('dragover');
                });

                this.dropZone.addEventListener('dragleave', () => {
                    this.dropZone.classList.remove('dragover');
                });

                this.dropZone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    this.dropZone.classList.remove('dragover');
                    this.handleFiles(e.dataTransfer.files);
                });

                this.convertBtn.addEventListener('click', () => {
                    this.convertAll();
                });

                this.clearBtn.addEventListener('click', () => {
                    this.clearAll();
                });
            }

            handleFiles(fileList) {
                const validFiles = [];
                for (const file of fileList) {
                    const ext = file.name.split('.').pop().toLowerCase();
                    if (['mcz', 'zip'].includes(ext)) {
                        validFiles.push(file);
                    } else {
                        this.addLog(`⚠️ 跳过不支持的文件: ${file.name}`, 'warning');
                    }
                }

                if (validFiles.length > 0) {
                    this.files.push(...validFiles);
                    this.renderFileList();
                    this.convertBtn.disabled = false;
                    this.addLog(`📥 添加 ${validFiles.length} 个压缩包`, 'info');
                }
            }

            renderFileList() {
                if (this.files.length === 0) {
                    this.fileList.classList.remove('show');
                    return;
                }

                this.fileList.classList.add('show');
                let html = '';

                for (let i = 0; i < this.files.length; i++) {
                    const file = this.files[i];
                    const size = (file.size / 1024).toFixed(1);
                    const status = file.status || 'waiting';
                    const statusMap = {
                        'waiting': { text: '等待处理', class: 'waiting' },
                        'extracting': { text: '解压中...', class: 'extracting' },
                        'processing': { text: '转换中...', class: 'processing' },
                        'success': { text: '✅ 完成', class: 'success' },
                        'error': { text: '❌ 失败', class: 'error' },
                        'done': { text: '✅ 已转换', class: 'success' }
                    };
                    const st = statusMap[status] || statusMap.waiting;

                    const mcFiles = file.mcFiles || [];
                    const hasResults = this.results[i] && this.results[i].files;
                    const successCount = hasResults ? this.results[i].files.length : 0;
                    const totalCount = mcFiles.length;

                    const isExpanded = this.expandedArchives.has(i);

                    html += `
                            <div class="file-item" data-index="${i}">
                                <div class="file-header">
                                    <div class="info">
                                        <span class="file-icon">📦</span>
                                        <div>
                                            <div class="file-name">${file.name}</div>
                                            <div class="file-size">${size} KB · ${totalCount > 0 ? totalCount + ' 个 .mc 文件' : '等待解压'}</div>
                                        </div>
                                    </div>
                                    <div class="status">
                                        <span class="badge ${st.class}">${st.text}</span>
                                        ${totalCount > 0 ? `<button class="toggle-files-btn" onclick="window.converter.toggleArchive(${i})">${isExpanded ? '📂 收起' : '📂 展开'}</button>` : ''}
                                    </div>
                                </div>
                                <div class="mc-files ${isExpanded ? 'show' : ''}" id="mc-files-${i}">
                                    ${this.renderMcFiles(i)}
                                </div>
                            </div>
                        `;
                }

                this.fileList.innerHTML = html;
            }

            renderMcFiles(index) {
                const file = this.files[index];
                const mcFiles = file.mcFiles || [];
                const result = this.results[index];

                if (mcFiles.length === 0) {
                    return `<div class="empty-state">没有找到 .mc 文件</div>`;
                }

                let html = '';
                for (let j = 0; j < mcFiles.length; j++) {
                    const mcFile = mcFiles[j];
                    const converted = result && result.files && result.files[j];

                    const statusText = converted ? '✅ 已转换' : '⏳ 待转换';
                    const statusColor = converted ? '#34d399' : 'rgba(255,255,255,0.3)';

                    html += `
                            <div class="mc-file-item">
                                <div class="mc-info">
                                    <span class="mc-icon">🎵</span>
                                    <span class="mc-name">${mcFile.name}</span>
                                    <span class="mc-status" style="color: ${statusColor}">${statusText}</span>
                                </div>
                                <div class="mc-actions">
                                    ${converted ? `
                                        <button class="btn-sm btn-download" onclick="window.converter.downloadSingle(${index}, ${j})">
                                            📥 下载
                                        </button>
                                        <button class="btn-sm btn-success-sm" onclick="window.converter.showPreview(${index}, ${j})">
                                            👁️ 预览
                                        </button>
                                    ` : `
                                        <span style="color:rgba(255,255,255,0.2);font-size:12px;">等待转换...</span>
                                    `}
                                </div>
                            </div>
                        `;
                }

                // 如果有多个文件，添加"下载全部"按钮
                const resultFiles = result ? result.files || [] : [];
                if (resultFiles.length > 1) {
                    html += `
                            <div style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.05);display:flex;justify-content:flex-end;">
                                <button class="btn-sm btn-download-all" onclick="window.converter.downloadArchiveAll(${index})">
                                    📥 下载此压缩包全部 (${resultFiles.length}个)
                                </button>
                            </div>
                        `;
                }

                return html;
            }

            toggleArchive(index) {
                if (this.expandedArchives.has(index)) {
                    this.expandedArchives.delete(index);
                } else {
                    this.expandedArchives.add(index);
                }
                this.renderFileList();
            }

            updateFileStatus(index, status, mcFiles = null) {
                this.files[index].status = status;
                if (mcFiles !== null) {
                    this.files[index].mcFiles = mcFiles;
                }
                this.renderFileList();
            }

            async convertAll() {
                if (this.isProcessing) return;
                if (this.files.length === 0) return;

                this.isProcessing = true;
                this.convertBtn.disabled = true;
                this.clearLog();
                this.results = [];

                this.progressBar.classList.add('show');
                this.progressFill.style.width = '0%';

                const totalFiles = this.files.length;
                let completed = 0;

                for (let i = 0; i < this.files.length; i++) {
                    const file = this.files[i];
                    this.updateFileStatus(i, 'extracting');
                    this.addLog(`📦 正在解压: ${file.name}`, 'info');

                    try {
                        const zipData = await this.readFile(file);
                        const zip = await JSZip.loadAsync(zipData);

                        const mcFiles = [];
                        for (const [path, zipEntry] of Object.entries(zip.files)) {
                            if (path.endsWith('.mc') && !zipEntry.dir) {
                                mcFiles.push({
                                    name: path.split('/').pop(),
                                    path: path,
                                    content: await zipEntry.async('string')
                                });
                            }
                        }

                        if (mcFiles.length === 0) {
                            this.addLog(`⚠️ 压缩包内没有找到 .mc 文件: ${file.name}`, 'warning');
                            this.updateFileStatus(i, 'error');
                            completed++;
                            this.updateProgress(completed, totalFiles);
                            continue;
                        }

                        this.addLog(`📄 找到 ${mcFiles.length} 个 .mc 文件`, 'info');
                        this.updateFileStatus(i, 'processing', mcFiles);

                        const convertedResults = [];
                        for (const mcFile of mcFiles) {
                            try {
                                const result = this.convertMCContent(mcFile.content, mcFile.name);
                                convertedResults.push({
                                    name: mcFile.name,
                                    data: result
                                });
                                this.addLog(`✅ 转换成功: ${mcFile.name}`, 'success');
                            } catch (error) {
                                this.addLog(`❌ 转换失败: ${mcFile.name} - ${error.message}`, 'error');
                                convertedResults.push({
                                    name: mcFile.name,
                                    data: null,
                                    error: error.message
                                });
                            }
                        }

                        this.results[i] = {
                            archiveName: file.name,
                            files: convertedResults
                        };

                        const successCount = convertedResults.filter(r => r.data !== null).length;
                        if (successCount === convertedResults.length) {
                            this.updateFileStatus(i, 'success');
                        } else if (successCount > 0) {
                            this.updateFileStatus(i, 'partial');
                        } else {
                            this.updateFileStatus(i, 'error');
                        }

                        // 自动展开
                        this.expandedArchives.add(i);
                        this.showStats();

                    } catch (error) {
                        this.addLog(`❌ 解压失败: ${file.name} - ${error.message}`, 'error');
                        this.updateFileStatus(i, 'error');
                    }

                    completed++;
                    this.updateProgress(completed, totalFiles);
                }

                this.addLog(`📊 处理完成!`, 'info');
                this.isProcessing = false;
                this.convertBtn.disabled = this.files.length === 0;

                setTimeout(() => {
                    this.progressBar.classList.remove('show');
                }, 1000);
            }

            updateProgress(completed, total) {
                const percent = (completed / total) * 100;
                this.progressFill.style.width = `${percent}%`;
            }

            readFile(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.onerror = () => reject(new Error('读取文件失败'));
                    reader.readAsArrayBuffer(file);
                });
            }

            convertMCContent(content, filename) {
                let data;
                try {
                    data = JSON.parse(content);
                } catch {
                    data = this.parseMCFormat(content);
                }

                const meta = data.meta || {};
                const song = meta.song || {};
                const noteData = data.note || [];
                const timeData = data.time || [];

                let bpm = 164;
                if (timeData.length > 0 && timeData[0].bpm) {
                    bpm = timeData[0].bpm;
                }

                const beatDuration = 60.0 / bpm;

                let offset = -0.207;
                let audioFile = 'song.mp3';
                for (const item of data.note || []) {
                    if (item.type === 1) {
                        if (item.offset !== undefined) {
                            offset = item.offset / 1000.0;
                        }
                        if (item.sound) {
                            audioFile = item.sound.replace(/\.ogg$/, '.mp3');
                        }
                        break;
                    }
                }

                const notes = [];
                for (const note of noteData) {
                    if (note.type === 1) continue;

                    const beat = note.beat || [0, 0, 1];
                    const endbeat = note.endbeat || null;
                    const column = note.column || 1;

                    const timeSec = this.beatToSeconds(beat, beatDuration);
                    let duration = beatDuration / 4.0;
                    if (endbeat) {
                        const endSec = this.beatToSeconds(endbeat, beatDuration);
                        duration = endSec - timeSec;
                    }

                    const pitch = column === 1 ? 76 : 67;
                    const tier = column === 1 ? 'high' : 'low';

                    notes.push({
                        time: Math.round(timeSec * 1000000) / 1000000,
                        duration: Math.round(duration * 1000000) / 1000000,
                        pitch: pitch,
                        type: 'normal',
                        tier: tier,
                        lane: column
                    });
                }

                notes.sort((a, b) => b.time - a.time);

                const notesByTime = {};
                for (const note of notes) {
                    const key = note.time;
                    if (!notesByTime[key]) notesByTime[key] = [];
                    notesByTime[key].push(note);
                }

                const resultNotes = [];
                let chordId = 0;
                for (const [time, noteGroup] of Object.entries(notesByTime)) {
                    if (noteGroup.length > 1) {
                        for (const note of noteGroup) {
                            note.gesture = 'chord';
                            note.groupId = `chord-${chordId}`;
                        }
                        chordId++;
                    }
                    resultNotes.push(...noteGroup);
                }

                const title = song.title || filename.replace(/\.mc$/, '');
                const artist = song.artist || 'Unknown';

                return {
                    songId: '',
                    title: title,
                    artist: artist,
                    bpm: bpm,
                    audioSrc: `assets/audio/${audioFile}`,
                    offset: offset,
                    duration: 83.414634,
                    notes: resultNotes,
                    backgroundShiftPoints: [],
                    characterSwitchPoints: [],
                    dualTrack: true,
                    splitNote: 72,
                    _log: ['谱面：COURSE:Oni LEVEL:1']
                };
            }

            beatToSeconds(beat, beatDuration) {
                if (Array.isArray(beat) && beat.length >= 3) {
                    const [bar, beatNum, division] = beat;
                    const totalBeats = bar * 4 + beatNum + division / 4.0;
                    return totalBeats * beatDuration;
                }
                return 0;
            }

            parseMCFormat(content) {
                const result = {
                    meta: { song: {} },
                    time: [],
                    note: []
                };

                const lines = content.split('\n');
                for (const line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed) continue;

                    if (trimmed.includes('title') && trimmed.includes(':')) {
                        const parts = trimmed.split(':');
                        if (parts.length > 1) {
                            result.meta.song.title = parts.slice(1).join(':').trim();
                        }
                        continue;
                    }

                    if (trimmed.toLowerCase().includes('bpm') && trimmed.includes(':')) {
                        const parts = trimmed.split(':');
                        if (parts.length > 1) {
                            try {
                                const bpm = parseFloat(parts[1].trim());
                                if (!isNaN(bpm)) {
                                    result.time = [{ beat: [0, 0, 1], bpm: bpm, delay: 0 }];
                                }
                            } catch {}
                        }
                        continue;
                    }

                    const parts = trimmed.split(/\s+/);
                    if (parts.length >= 2) {
                        try {
                            const beatStr = parts[0];
                            const col = parseInt(parts[parts.length - 1]);
                            if (isNaN(col) || col < 1 || col > 4) continue;

                            let beat;
                            if (beatStr.startsWith('[') && beatStr.endsWith(']')) {
                                const beatParts = beatStr.slice(1, -1).split(',');
                                if (beatParts.length >= 3) {
                                    beat = beatParts.map(x => parseInt(x.trim()));
                                } else {
                                    beat = [0, 0, 1];
                                }
                            } else if (beatStr.includes('.')) {
                                const [bar, beatNum] = beatStr.split('.');
                                beat = [parseInt(bar), parseInt(beatNum), 1];
                            } else {
                                beat = [parseInt(beatStr), 0, 1];
                            }

                            const note = { beat: beat, column: col };
                            if (parts.length >= 3 && parts[1].startsWith('[')) {
                                const endStr = parts[1];
                                if (endStr.startsWith('[') && endStr.endsWith(']')) {
                                    const endParts = endStr.slice(1, -1).split(',');
                                    if (endParts.length >= 3) {
                                        note.endbeat = endParts.map(x => parseInt(x.trim()));
                                    }
                                }
                            }
                            result.note.push(note);
                        } catch {}
                    }
                }

                return result;
            }

            showStats() {
                this.stats.classList.add('show');
                let totalNotes = 0;
                let totalChords = 0;
                let totalFiles = 0;
                let successFiles = 0;

                for (const result of this.results) {
                    if (!result) continue;
                    for (const file of result.files || []) {
                        if (file.data && file.data.notes) {
                            totalFiles++;
                            successFiles++;
                            totalNotes += file.data.notes.length;
                            totalChords += file.data.notes.filter(n => n.gesture === 'chord').length;
                        }
                    }
                }

                this.stats.innerHTML = `
                        <div class="stat-item">
                            <div class="stat-value">${totalFiles}</div>
                            <div class="stat-label">转换文件数</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${totalNotes}</div>
                            <div class="stat-label">音符总数</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${totalChords}</div>
                            <div class="stat-label">和弦音符</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${this.results.length > 0 && this.results[0] && this.results[0].files && this.results[0].files.length > 0 && this.results[0].files[0].data ? this.results[0].files[0].data.bpm : '-'}</div>
                            <div class="stat-label">BPM</div>
                        </div>
                    `;
            }

            downloadSingle(archiveIndex, fileIndex) {
                const result = this.results[archiveIndex];
                if (!result) return;

                const file = result.files[fileIndex];
                if (!file || !file.data) return;

                this.downloadFile(file.data, file.name);
            }

            downloadArchiveAll(archiveIndex) {
                const result = this.results[archiveIndex];
                if (!result) return;

                const files = result.files || [];
                const validFiles = files.filter(f => f.data !== null);

                if (validFiles.length === 0) {
                    this.addLog('⚠️ 没有可下载的文件', 'warning');
                    return;
                }

                if (validFiles.length === 1) {
                    this.downloadFile(validFiles[0].data, validFiles[0].name);
                    return;
                }

                const zip = new JSZip();
                for (const file of validFiles) {
                    const name = file.name.replace(/\.mc$/, '') + '_converted.json';
                    zip.file(name, JSON.stringify(file.data, null, 2));
                }

                zip.generateAsync({ type: 'blob' }).then((blob) => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${result.archiveName.replace(/\.[^.]+$/, '')}_谱面合集.zip`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    this.addLog(`📥 已下载: ${a.download}`, 'success');
                });
            }

            downloadFile(data, filename) {
                const jsonStr = JSON.stringify(data, null, 2);
                const blob = new Blob([jsonStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = url;
                a.download = filename.replace(/\.mc$/, '') + '_converted.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                this.addLog(`📥 已下载: ${a.download}`, 'success');
            }

            showPreview(archiveIndex, fileIndex) {
                const result = this.results[archiveIndex];
                if (!result) return;

                const file = result.files[fileIndex];
                if (!file || !file.data) return;

                const jsonStr = JSON.stringify(file.data, null, 2);

                // 创建预览窗口
                const overlay = document.createElement('div');
                overlay.style.cssText = `
                        position: fixed;
                        top: 0; left: 0;
                        width: 100%; height: 100%;
                        background: rgba(0,0,0,0.8);
                        backdrop-filter: blur(10px);
                        z-index: 9999;
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        padding: 20px;
                    `;

                const modal = document.createElement('div');
                modal.style.cssText = `
                        background: #1a1a2e;
                        border-radius: 16px;
                        max-width: 800px;
                        width: 100%;
                        max-height: 80vh;
                        display: flex;
                        flex-direction: column;
                        border: 1px solid rgba(255,255,255,0.1);
                        overflow: hidden;
                    `;

                const header = document.createElement('div');
                header.style.cssText = `
                        padding: 16px 20px;
                        border-bottom: 1px solid rgba(255,255,255,0.05);
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                        flex-shrink: 0;
                    `;
                header.innerHTML = `
                        <span style="color:#fff;font-weight:600;">📄 ${file.name.replace(/\.mc$/, '')}_converted.json</span>
                        <button style="background:none;border:none;color:rgba(255,255,255,0.4);font-size:24px;cursor:pointer;">✕</button>
                    `;

                const body = document.createElement('div');
                body.style.cssText = `
                        padding: 16px 20px;
                        overflow-y: auto;
                        flex: 1;
                    `;

                const pre = document.createElement('pre');
                pre.style.cssText = `
                        color: rgba(255,255,255,0.8);
                        font-size: 12px;
                        font-family: 'JetBrains Mono', monospace;
                        white-space: pre-wrap;
                        word-break: break-all;
                        margin: 0;
                        line-height: 1.6;
                    `;
                pre.textContent = jsonStr;
                body.appendChild(pre);

                const footer = document.createElement('div');
                footer.style.cssText = `
                        padding: 12px 20px;
                        border-top: 1px solid rgba(255,255,255,0.05);
                        display: flex;
                        justify-content: flex-end;
                        flex-shrink: 0;
                    `;
                footer.innerHTML = `
                        <button style="padding:8px 20px;border:none;border-radius:8px;background:linear-gradient(135deg,#4facfe,#00f2fe);color:#fff;font-weight:600;cursor:pointer;">关闭</button>
                    `;

                modal.appendChild(header);
                modal.appendChild(body);
                modal.appendChild(footer);
                overlay.appendChild(modal);
                document.body.appendChild(overlay);

                // 关闭事件
                const close = () => document.body.removeChild(overlay);
                header.querySelector('button').addEventListener('click', close);
                footer.querySelector('button').addEventListener('click', close);
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) close();
                });

                // ESC 关闭
                const escHandler = (e) => {
                    if (e.key === 'Escape') {
                        close();
                        document.removeEventListener('keydown', escHandler);
                    }
                };
                document.addEventListener('keydown', escHandler);
            }

            addLog(message, type = 'info') {
                this.logArea.classList.add('show');
                const entry = document.createElement('div');
                entry.className = `log-entry ${type}`;
                entry.textContent = message;
                this.logArea.appendChild(entry);
                this.logArea.scrollTop = this.logArea.scrollHeight;
            }

            clearLog() {
                this.logArea.innerHTML = '';
                this.logArea.classList.remove('show');
                this.stats.classList.remove('show');
            }

            clearAll() {
                this.files = [];
                this.results = [];
                this.expandedArchives.clear();
                this.renderFileList();
                this.convertBtn.disabled = true;
                this.clearLog();
                this.progressBar.classList.remove('show');
                this.progressFill.style.width = '0%';
                this.addLog('🗑️ 已清空所有文件', 'info');
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            window.converter = new MCZConverter();
        });
    </script>
</body>
</html>
